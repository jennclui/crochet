
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crochet Pattern Visualizer</title>

<style>
/* How it works: Define the colours used for stitches and instruction groups. */
:root {
    --group-grey: #e8e8e8;
    --sc-color: #d8eaff;
    --hdc-color: #d9f0df;
    --dc-color: #ffe6b8;
    --tr-color: #eadcff;
    --dtr-color: #ffdce2;
    --sl-st-color: #d9f3f0;
    --ch-color: #fff2a8;
    --border-color: #d5d5d5;
}

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
    color: #292929;
    line-height: 1.8;
}

h1 {
    margin-bottom: 8px;
}

.description {
    color: #555;
    margin-bottom: 24px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

textarea {
    box-sizing: border-box;
    width: 100%;
    min-height: 140px;
    padding: 14px;
    font-family: monospace;
    font-size: 15px;
    line-height: 1.7;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    resize: vertical;
}

button {
    margin: 12px 0 24px;
    padding: 10px 18px;
    border: 0;
    border-radius: 5px;
    background: #333;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

/* Pattern preview container. */
.preview {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    background: #fff;
}

.preview h2 {
    font-size: 20px;
    margin: 0 0 20px;
}

/*
Each comma-separated instruction has a grey background.
Instructions remain inline and wrap naturally.
The 20px right margin separates adjacent instructions.
*/
.instruction {
    display: inline;
    margin-right: 20px;
    padding: 5px 7px;
    border-radius: 5px;
    background: var(--group-grey);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}

/* Highlight stitch counts and abbreviations. */
.stitch {
    display: inline;
    padding: 2px 4px;
    border-radius: 4px;
    font-weight: bold;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}

.st-sc  { background: var(--sc-color); }
.st-hdc { background: var(--hdc-color); }
.st-dc  { background: var(--dc-color); }
.st-tr  { background: var(--tr-color); }
.st-dtr { background: var(--dtr-color); }
.st-sl  { background: var(--sl-st-color); }
.st-ch  { background: var(--ch-color); }

/* Colour legend. */
.stitch-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 20px;
}

.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
}

.legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
}

.legend-group { background: var(--group-grey); }
.legend-sc { background: var(--sc-color); }
.legend-hdc { background: var(--hdc-color); }
.legend-dc { background: var(--dc-color); }
.legend-tr { background: var(--tr-color); }
.legend-dtr { background: var(--dtr-color); }
.legend-sl { background: var(--sl-st-color); }
.legend-ch { background: var(--ch-color); }

@media (max-width: 600px) {
    body {
        margin: 15px auto;
        padding: 0 12px;
    }

    .preview {
        padding: 12px;
    }
}
</style>
</head>

<body>

<h1>Crochet Pattern Visualizer</h1>

<p class="description">
    Paste a crochet pattern below. Each comma-separated instruction
    will be highlighted in grey. Stitch counts and abbreviations will
    receive their own colours, and square brackets will be hidden.
</p>

<label for="patternInput">Crochet pattern</label>

<textarea id="patternInput" spellcheck="false">[3 dc] in ch-3 sp, 3 tr in next dc, 16 dc in next round, 2 sc in next st, sl st to join</textarea>

<button type="button" id="resetPattern">Reset example</button>

<section class="preview" aria-live="polite">
    <h2>Formatted pattern</h2>
    <div id="patternOutput"></div>
</section>

<div class="stitch-legend" aria-label="Stitch colour legend">
    <span class="legend-item">
        <span class="legend-swatch legend-group"></span>
        Instruction group
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-sc"></span>
        SC
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-hdc"></span>
        HDC
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-dc"></span>
        DC
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-tr"></span>
        TR
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-dtr"></span>
        DTR
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-sl"></span>
        SL ST
    </span>
    <span class="legend-item">
        <span class="legend-swatch legend-ch"></span>
        CH
    </span>
</div>

<script>
/*
Purpose: Convert crochet pattern text into a colour-coded,
inline preview.

How it works:
1. Split instructions at commas outside square brackets.
2. Apply a grey background to each complete instruction.
3. Hide square brackets and preserve their grouped text.
4. Highlight stitch counts and abbreviations.
5. Keep instructions inline with 20px of spacing.
*/

const patternInput = document.getElementById("patternInput");
const patternOutput = document.getElementById("patternOutput");
const resetButton = document.getElementById("resetPattern");

const examplePattern =
    "[3 dc] in ch-3 sp, 3 tr in next dc, 16 dc in next round, 2 sc in next st, sl st to join";

/* Longer abbreviations must be checked before shorter ones. */
const stitchTypes = [
    {
        name: "dtr",
        pattern: "dtr",
        className: "st-dtr"
    },
    {
        name: "tr",
        pattern: "tr",
        className: "st-tr"
    },
    {
        name: "hdc",
        pattern: "hdc",
        className: "st-hdc"
    },
    {
        name: "dc",
        pattern: "dc",
        className: "st-dc"
    },
    {
        name: "sc",
        pattern: "sc",
        className: "st-sc"
    },
    {
        name: "sl st",
        pattern: "sl\\s*st",
        className: "st-sl"
    },
    {
        name: "ch",
        pattern: "ch",
        className: "st-ch"
    }
];

/*
Split at commas only when outside square brackets.
Nested brackets are supported.
*/
function splitInstructions(text) {
    const instructions = [];
    let current = "";
    let bracketDepth = 0;

    for (const character of text) {
        if (character === "[") {
            bracketDepth++;
            current += character;
        } else if (character === "]") {
            bracketDepth = Math.max(0, bracketDepth - 1);
            current += character;
        } else if (character === "," && bracketDepth === 0) {
            if (current.trim()) {
                instructions.push(current.trim());
            }

            current = "";
        } else {
            current += character;
        }
    }

    if (current.trim()) {
        instructions.push(current.trim());
    }

    return instructions;
}

/* Build a regular expression for supported stitch abbreviations. */
function getStitchRegex() {
    const alternatives = stitchTypes
        .map(stitch => stitch.pattern)
        .join("|");

    return new RegExp(
        "(\\d+)\\s+(" + alternatives + ")(?![a-z])",
        "gi"
    );
}

/* Identify the CSS class associated with a stitch abbreviation. */
function getStitchClass(abbreviation) {
    const normalized = abbreviation
        .toLowerCase()
        .replace(/\s+/g, " ");

    const stitch = stitchTypes.find(item => {
        const regex = new RegExp(
            "^" + item.pattern + "$",
            "i"
        );

        return regex.test(normalized);
    });

    return stitch ? stitch.className : "";
}

/*
Highlight recognized stitch counts and abbreviations.
All other content is inserted as plain text.
*/
function renderHighlightedText(container, text) {
    const regex = getStitchRegex();
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
            container.appendChild(
                document.createTextNode(
                    text.slice(lastIndex, match.index)
                )
            );
        }

        const stitch = document.createElement("span");
        stitch.className =
            "stitch " + getStitchClass(match[2]);

        stitch.textContent = match[0];
        container.appendChild(stitch);

        lastIndex = regex.lastIndex;
    }

    if (lastIndex < text.length) {
        container.appendChild(
            document.createTextNode(text.slice(lastIndex))
        );
    }
}

/*
Hide square brackets and highlight their contents.
The enclosing instruction retains its grey background.
*/
function renderInstruction(container, instruction) {
    let position = 0;

    while (position < instruction.length) {
        const openIndex = instruction.indexOf("[", position);

        if (openIndex === -1) {
            renderHighlightedText(
                container,
                instruction.slice(position)
            );
            break;
        }

        renderHighlightedText(
            container,
            instruction.slice(position, openIndex)
        );

        let depth = 1;
        let closeIndex = openIndex + 1;

        while (
            closeIndex < instruction.length &&
            depth > 0
        ) {
            if (instruction[closeIndex] === "[") {
                depth++;
            }

            if (instruction[closeIndex] === "]") {
                depth--;
            }

            closeIndex++;
        }

        const hasClosingBracket = depth === 0;

        const groupEnd = hasClosingBracket
            ? closeIndex - 1
            : instruction.length;

        const group = document.createElement("span");
        group.className = "bracket-group";

        renderHighlightedText(
            group,
            instruction.slice(openIndex + 1, groupEnd)
        );

        container.appendChild(group);

        position = hasClosingBracket
            ? closeIndex
            : instruction.length;
    }
}

/* Render instructions inline, separated by commas and 20px spacing. */
function updatePreview() {
    patternOutput.replaceChildren();

    const instructions = splitInstructions(patternInput.value);

    instructions.forEach((instruction, index) => {
        const group = document.createElement("span");
        group.className = "instruction";

        renderInstruction(group, instruction);

        patternOutput.appendChild(group);

        if (index < instructions.length - 1) {
            patternOutput.appendChild(
                document.createTextNode(",")
            );
        }
    });
}

/* Update the preview whenever the pattern is edited. */
patternInput.addEventListener("input", updatePreview);

/* Restore the original sample pattern. */
resetButton.addEventListener("click", () => {
    patternInput.value = examplePattern;
    updatePreview();
});

/* Display the initial pattern. */
updatePreview();
</script>

</body>
</html>
